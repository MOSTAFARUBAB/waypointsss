name: Build Simple Waypoints (Minecraft 26.3)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build beam-only mod
        run: gradle clean build --no-daemon -PwithBeam=true

      - name: Verify mod JAR exists
        shell: bash
        run: |
          ls -lah build/libs
          test -n "$(find build/libs -maxdepth 1 -type f -name '*-beam-only-*.jar' -print -quit)"

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: simple-waypoints-mc-26.3-beam-only
          path: build/libs/*-beam-only-*.jar
          if-no-files-found: error
          compression-level: 0
